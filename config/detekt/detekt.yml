config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  # LargeClass stays enforced on production code, but an exhaustive test class (one method per
  # behaviour + in-file fakes) legitimately grows past the threshold — that's coverage, not debt.
  # Consistent with LongMethod/TooManyFunctions already disabled project-wide.
  LargeClass:
    excludes: ['**/src/test/**', '**/src/androidTest/**']

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
      - Test

style:
  MagicNumber:
    active: false
  ForbiddenImport:
    active: true
    imports:
      - androidx.compose.material.*
      - kotlinx.coroutines.GlobalScope
      - androidx.lifecycle.LiveData
  # Pas de marqueur TODO/FIXME/STOPSHIP en code de PRODUCTION (cf. contributing.md) — ouvrir/lier
  # une issue à la place. Scopé src/main : tests, fixtures et docs ne sont pas concernés. Redéfinir
  # `comments:` remplace la liste par défaut, donc on répète STOPSHIP.
  ForbiddenComment:
    active: true
    includes:
      - '**/src/main/**'
    comments:
      - reason: 'TODO interdit en prod — ouvrir/lier une issue (cf. contributing.md).'
        value: '\bTODO\s*(?:\(|:)'
      - reason: 'FIXME interdit en prod — ouvrir/lier une issue (cf. contributing.md).'
        value: '\bFIXME\b'
      - reason: 'STOPSHIP interdit.'
        value: '\bSTOPSHIP\b'
