name: Release

# Channel-routed CD (#233, #304). Dispatch-only model:
# - The publish channel is chosen via the `channel` input (beta | dev). There is NO release-event
#   trigger any more — beta no longer needs a hand-published GitHub Release; both channels ship from
#   a single "Run workflow" dispatch.
# - Play: ONE app fr.forumhfr.redface2, ONE listing; the launcher label is set per build (-PappLabel)
#   and the channel routes only the Play TRACK.
# - F-Droid: distinct applicationId per channel (.beta/.dev) = distinct, COEXISTING F-Droid apps.
#
#   channel=beta → Play open testing (base appId, label "Redface 2 β")  + F-Droid fr.forumhfr.redface2.beta
#   channel=dev  → Play internal     (base appId, label "Redface 2 dev") + F-Droid fr.forumhfr.redface2.dev
#
# versionCode (CANONICAL LEDGER): a single monotonic counter SHARED by beta and dev — the set of
# `app-v<N>` git tags IS the ledger. Each ship computes `versionCode = max(app-v* tags, build.gradle
# floor) + 1`, so beta and dev interleave on one strictly-increasing sequence (no manual bump, no
# beta-vs-dev inversion). The run creates a prerelease `app-v<N>` carrying the signed artefacts, so
# the F-Droid publisher (which downloads from a Release) has a source. `concurrency` serialises runs
# so two dispatches never allocate the same code. Prod/stable is deferred (#302/#304) — set aside.
#
# versionName (MARKETING, manual): decoupled from versionCode. MUST be bumped in app/build.gradle.kts
# before EVERY public (beta) ship — F-Droid keys its version display on versionName, so two builds at
# the same versionName show as duplicate "X.Y.Z" entries (happened with app-v84/v85, both 0.5.0). A
# guard step (below) fails a beta ship whose versionName matches the previous beta release. dev is
# exempt (it adds a versionNameSuffix).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de publication'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - beta
      ref:
        description: 'Branch/tag à builder (défaut: ref courant)'
        required: false
        default: ''
        type: string

# Single global group: serialise ALL ship runs so the tag-ledger versionCode allocation is atomic
# (two parallel dispatches must not both read the same max and allocate the same code).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Routing: map the `channel` input → Play track + F-Droid package + label. No versionCode here
  # (it needs the checkout/tags, resolved in the build job's meta step).
  # ──────────────────────────────────────────────────────────────────────
  resolve-target:
    name: Resolve channel target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.r.outputs.channel }}
      app_label: ${{ steps.r.outputs.app_label }}
      play_upload: ${{ steps.r.outputs.play_upload }}
      play_track: ${{ steps.r.outputs.play_track }}
      play_status: ${{ steps.r.outputs.play_status }}
      play_package: ${{ steps.r.outputs.play_package }}
      fdroid_flavor: ${{ steps.r.outputs.fdroid_flavor }}
      fdroid_dir: ${{ steps.r.outputs.fdroid_dir }}
      fdroid_package: ${{ steps.r.outputs.fdroid_package }}
      fdroid_channel: ${{ steps.r.outputs.fdroid_channel }}
      build_ref: ${{ steps.r.outputs.build_ref }}
    steps:
      - id: r
        shell: bash
        # GitHub-expressions through env, NEVER interpolated into the script body (the dispatch ref is
        # user-controlled; `${{ }}` substitution happens before bash runs).
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
          DISPATCH_REF: ${{ inputs.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Validate the user-controlled ref BEFORE it reaches $GITHUB_OUTPUT (a newline could inject
          # extra output lines and reroute the deploy).
          if [[ -n "${DISPATCH_REF:-}" && ! "$DISPATCH_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid dispatch ref '${DISPATCH_REF}' — only [A-Za-z0-9._/-] allowed."
            exit 1
          fi
          # Effective ref actually built downstream = build_ref || github.ref (cf. checkout step).
          effective_ref="${DISPATCH_REF:-$GH_REF_NAME}"
          # The PLAY artifact is ALWAYS the base applicationId (prod flavor); only label + track vary.
          play_package=fr.forumhfr.redface2
          case "$CHANNEL_INPUT" in
            beta)
              # beta publishes to PUBLIC open testing → it must ship from `main` only. A dispatch on a
              # feature branch (or a `ref` override pointing elsewhere) is refused, so a half-baked
              # branch can never reach the public beta track (#316).
              if [[ "$effective_ref" != "main" && "$effective_ref" != "refs/heads/main" ]]; then
                echo "::error::channel=beta must build from 'main' (effective ref='${effective_ref}'). Dispatch with --ref main (and no 'ref' override, or ref=main)."
                exit 1
              fi
              channel=beta
              app_label="Redface 2 β"
              play_upload=true; play_track=beta; play_status=completed
              fdroid_flavor=Beta; fdroid_dir=beta; fdroid_package=fr.forumhfr.redface2.beta; fdroid_channel=beta
              ;;
            dev)
              channel=dev
              app_label="Redface 2 dev"
              play_upload=true; play_track=internal; play_status=completed
              fdroid_flavor=Dev; fdroid_dir=dev; fdroid_package=fr.forumhfr.redface2.dev; fdroid_channel=dev
              ;;
            *)
              echo "::error::Unsupported channel '${CHANNEL_INPUT}' — expected 'beta' or 'dev'."
              exit 1
              ;;
          esac
          {
            echo "channel=$channel"
            echo "app_label=$app_label"
            echo "play_upload=$play_upload"
            echo "play_track=$play_track"
            echo "play_status=$play_status"
            echo "play_package=$play_package"
            echo "fdroid_flavor=$fdroid_flavor"
            echo "fdroid_dir=$fdroid_dir"
            echo "fdroid_package=$fdroid_package"
            echo "fdroid_channel=$fdroid_channel"
            echo "build_ref=$DISPATCH_REF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Release target::channel=$channel label='${app_label}' play=$play_upload track=$play_track fdroid=$fdroid_channel/$fdroid_package ref=${DISPATCH_REF:-<current>}"

      - name: Guard — versionName must be bumped for a beta (public) ship
        if: ${{ steps.r.outputs.channel == 'beta' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # beta is PUBLIC (Play open testing + F-Droid). F-Droid keys its version display on versionName
          # (not versionCode), so two beta builds at the same versionName show as DUPLICATE "X.Y.Z" entries
          # (app-v84/v85 were both 0.5.0). versionCode is auto-allocated from the tag ledger; versionName
          # is the ONLY manual knob → it MUST be bumped before each beta ship.
          # Runs HERE (resolve-target, ubuntu, has gh) NOT in the build job — the build runs in the
          # android-sdk container WITHOUT gh (a first attempt failed with `gh: command not found`). It
          # runs BEFORE the build job (which `needs: resolve-target`), so a failure aborts with NO side
          # effect (no tag, no Play upload). beta always builds from main, so the current versionName is
          # main's. dev is exempt (it adds a versionNameSuffix); the step is skipped for dev.
          # We compare against the previous BETA release specifically (Release name carries the "β"
          # marker) — NOT just the highest tag — so promoting a dev-tested version to beta at the same
          # versionName is NOT wrongly blocked (only a beta↔beta versionName clash is).
          read_vn() { # $1 = git ref → echo the versionName field of app/build.gradle.kts, or empty
            gh api "repos/ForumHFR/redface2/contents/app/build.gradle.kts?ref=$1" --jq '.content' 2>/dev/null \
              | base64 -d 2>/dev/null \
              | grep -E '^[[:space:]]+versionName[[:space:]]*=' | head -1 | sed -E 's/.*"(.*)".*/\1/' || true
          }
          current_vn=$(read_vn main)
          [[ -n "$current_vn" ]] || { echo "::error::could not read current versionName from main"; exit 1; }
          # test()+ltrimstr, not capture(): capture() THROWS on a non-match, aborting jq under set -e.
          # Exclude drafts (a draft app-v<N> with "β" must not count as the previous beta — Codex) and
          # guard a null .name. --limit 200 covers far more interleaved beta+dev ships than we have.
          prev=$(gh release list --repo ForumHFR/redface2 --limit 200 --json tagName,name,isDraft \
                   --jq '[.[] | select(.isDraft | not) | select((.name // "") | contains("β")) | select(.tagName | test("^app-v[0-9]+$")) | (.tagName | ltrimstr("app-v") | tonumber)] | max // 0')
          if [[ "$prev" == "0" ]]; then
            echo "::notice::No previous beta release — versionName bump guard is a no-op (first beta)."
            exit 0
          fi
          prev_tag="app-v${prev}"
          prev_vn=$(read_vn "$prev_tag")
          if [[ -z "$prev_vn" ]]; then
            echo "::warning::Could not read versionName at ${prev_tag}; skipping the guard rather than blocking a legit ship."
            exit 0
          fi
          echo "current main versionName='${current_vn}' | previous beta ${prev_tag} versionName='${prev_vn}'"
          if [[ "$current_vn" == "$prev_vn" ]]; then
            echo "::error::versionName '${current_vn}' was already shipped to the public beta track (${prev_tag}). Bump versionName in app/build.gradle.kts before a beta ship — two builds at the same versionName produce duplicate entries on F-Droid."
            exit 1
          fi
          echo "::notice::versionName bump OK for beta (${prev_vn} → ${current_vn})."

  build:
    name: Build, sign and publish (${{ needs.resolve-target.outputs.channel }})
    needs: [resolve-target]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.meta.outputs.version_code }}
      version_name: ${{ steps.meta.outputs.version_name }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      full_sha: ${{ steps.meta.outputs.full_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      fdroid_apk: ${{ steps.artefacts.outputs.fdroid_apk_filename }}
    env:
      APP_LABEL: ${{ needs.resolve-target.outputs.app_label }}
      PLAY_UPLOAD: ${{ needs.resolve-target.outputs.play_upload }}
      PLAY_TRACK: ${{ needs.resolve-target.outputs.play_track }}
      PLAY_STATUS: ${{ needs.resolve-target.outputs.play_status }}
      PLAY_PACKAGE: ${{ needs.resolve-target.outputs.play_package }}
      FDROID_FLAVOR: ${{ needs.resolve-target.outputs.fdroid_flavor }}
      FDROID_DIR: ${{ needs.resolve-target.outputs.fdroid_dir }}
      FDROID_PACKAGE: ${{ needs.resolve-target.outputs.fdroid_package }}
      CHANNEL: ${{ needs.resolve-target.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.build_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Trust workspace for git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve version metadata (canonical tag ledger)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # CANONICAL versionCode = max(app-v* tag ledger, build.gradle.kts floor) + 1.
          # The git `app-v<N>` tags are the running ledger (shared by beta+dev). The build.gradle.kts
          # versionCode is a SAFETY FLOOR for the all-tags-missing case only.
          # FAIL CLOSED on a fetch error: once the ledger has advanced past the floor, allocating from a
          # stale/partial tag set would reuse or lower a code (Play rejects, F-Droid stops updating). The
          # tags are the source of truth, so a refresh failure must abort, not silently fall back (Codex P2).
          git fetch --tags --force --prune origin >/dev/null 2>&1 || {
            echo "::error::tag ledger fetch failed — refusing to allocate a versionCode from possibly stale tags"
            exit 1
          }
          base_code=$(grep -E '^[[:space:]]+versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+' | tail -1)
          [[ -n "$base_code" ]] || { echo "::error::base versionCode unresolved from build.gradle.kts"; exit 1; }
          ledger_code=$(git tag -l 'app-v*' | sed -nE 's/^app-v([0-9]+)$/\1/p' | sort -n | tail -1)
          ledger_code=${ledger_code:-0}
          floor=$(( ledger_code > base_code ? ledger_code : base_code ))
          version_code=$(( floor + 1 ))
          version_name=$(grep -E '^[[:space:]]+versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          short_sha=$(git rev-parse --short HEAD)
          full_sha=$(git rev-parse HEAD)
          release_tag="app-v${version_code}"
          [[ -n "$version_name" ]] || { echo "::error::versionName unresolved"; exit 1; }
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "short_sha=$short_sha"
            echo "full_sha=$full_sha"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Build::channel=${CHANNEL} versionCode=${version_code} (ledger=${ledger_code} floor=${base_code}) versionName=${version_name} tag=${release_tag} sha=${short_sha} label='${APP_LABEL:-<default>}'"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode upload keystore
        id: keystore
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${UPLOAD_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is missing — cannot sign release artefacts"
            exit 1
          fi
          path="${RUNNER_TEMP}/upload.jks"
          echo "${UPLOAD_KEYSTORE_BASE64}" | base64 -d > "${path}"
          if ! keytool -list -keystore "${path}" -storepass "${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "::error::Decoded keystore is not a valid PKCS12/JKS or the password is wrong"
            exit 1
          fi
          echo "path=${path}" >>"$GITHUB_OUTPUT"

      - name: Write Play Console service account JSON
        id: service_account
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            # FAIL CLOSED before any side effect (#316): this step runs BEFORE the build, the ledger
            # tag/Release and the F-Droid notify. On a channel that publishes to Play (beta/dev), a
            # missing SA would otherwise let the run advance the versionCode ledger (create app-v<N>)
            # and notify F-Droid while silently skipping Play — burning a code with no Play upload.
            # So abort here when PLAY_UPLOAD=true; only a non-Play channel may skip cleanly.
            if [[ "${PLAY_UPLOAD}" == "true" ]]; then
              echo "::error::PLAY_SERVICE_ACCOUNT_JSON not set but channel '${CHANNEL}' publishes to Play — refusing to advance the versionCode ledger without a Play upload. Aborting before any side effect."
              exit 1
            fi
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set; Play upload will be skipped (non-Play channel)."
            echo "path=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          path="${RUNNER_TEMP}/play-service-account.json"
          printf '%s' "${PLAY_SERVICE_ACCOUNT_JSON}" > "${path}"
          if ! grep -q '"client_email"' "${path}"; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON does not look like a service account JSON (missing client_email)"
            exit 1
          fi
          echo "path=${path}" >>"$GITHUB_OUTPUT"

      - name: Build signed artefacts
        env:
          UPLOAD_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          EFFECTIVE_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          # Both channels now carry a ledger-allocated versionCode → always inject the override (into
          # the F-Droid flavor AND the Play prod-flavor build, which share GRADLE_ARGS).
          GRADLE_ARGS=(--no-daemon --stacktrace "-PversionCodeOverride=${EFFECTIVE_VERSION_CODE}")
          [[ -n "${APP_LABEL:-}" ]] && GRADLE_ARGS+=("-PappLabel=${APP_LABEL}")
          # F-Droid artefact: the channel flavor (suffixed appId .beta/.dev).
          ./gradlew ":app:assemble${FDROID_FLAVOR}Release" "${GRADLE_ARGS[@]}"
          # Play artefact: base applicationId (prod flavor), uploaded to the channel's track.
          if [[ "${PLAY_UPLOAD}" == "true" ]]; then
            ./gradlew ":app:bundleProdRelease" ":app:assembleProdRelease" "${GRADLE_ARGS[@]}"
          fi

      - name: Verify signatures + package/label/versionCode (CI check)
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          [[ -x "$AAPT2" ]] || { echo "::error::aapt2 not found under $ANDROID_HOME/build-tools"; exit 1; }
          [[ -x "$APKSIGNER" ]] || { echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          EXPECTED_VC="${{ steps.meta.outputs.version_code }}"
          # $1=apk $2=expected package $3=expected label (empty → don't assert label)
          check_apk() {
            local apk="$1" want_pkg="$2" want_label="$3" badging vc
            # APKs use the APK Signature Scheme (v2/v3), NOT a v1/JAR signature at minSdk 29, so
            # apksigner — not jarsigner — is the right verifier (Codex P1). jarsigner stays for the AAB.
            "$APKSIGNER" verify "$apk" >/dev/null
            badging="$("$AAPT2" dump badging "$apk")"
            grep -q "package: name='${want_pkg}'" <<<"$badging" || {
              echo "::error::${apk}: package mismatch (want ${want_pkg})"; grep '^package:' <<<"$badging"; exit 1; }
            # Assert the BUILT versionCode matches the ledger code we advertise: a ref that lacks
            # -PversionCodeOverride support would silently keep the checked-out code, diverging from the
            # code we tag, upload to Play and tell F-Droid.
            vc="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$badging" | head -1)"
            [[ "$vc" == "$EXPECTED_VC" ]] || {
              echo "::error::${apk}: versionCode mismatch (apk=${vc}, expected=${EXPECTED_VC}) — ref may lack -PversionCodeOverride support"; exit 1; }
            if [[ -n "$want_label" ]]; then
              # Tolerate both aapt2 forms: `application-label:'X'` and `application: label='X'`.
              grep -Eq "(application-label:|label=)'${want_label}'" <<<"$badging" || {
                echo "::error::${apk}: label mismatch (want ${want_label})"; grep -E "label" <<<"$badging"; exit 1; }
            fi
            echo "OK: ${apk} → ${want_pkg} / vc=${vc} / '${want_label:-<default>}'"
          }
          fdroid_apk="$(ls app/build/outputs/apk/${FDROID_DIR}/release/*.apk | head -1)"
          check_apk "$fdroid_apk" "$FDROID_PACKAGE" "${APP_LABEL:-}"
          if [[ "${PLAY_UPLOAD}" == "true" ]]; then
            play_apk="$(ls app/build/outputs/apk/prod/release/*.apk | head -1)"
            check_apk "$play_apk" "$PLAY_PACKAGE" "${APP_LABEL:-}"
            aab="$(ls app/build/outputs/bundle/prodRelease/*.aab | head -1)"
            jarsigner -verify "$aab" >/dev/null && echo "OK: ${aab} signed"
          fi

      - name: Stage artefacts
        id: artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artefacts
          V="v${{ steps.meta.outputs.version_code }}-${{ steps.meta.outputs.short_sha }}"
          # F-Droid APK (suffixed appId) — what redface2-fdroid downloads from the Release.
          fdroid_apk="$(ls app/build/outputs/apk/${FDROID_DIR}/release/*.apk | head -1)"
          fdroid_dest="release-artefacts/redface2-fdroid-${CHANNEL}-${V}.apk"
          cp "$fdroid_apk" "$fdroid_dest"
          echo "fdroid_apk_filename=$(basename "$fdroid_dest")" >>"$GITHUB_OUTPUT"
          if [[ "${PLAY_UPLOAD}" == "true" ]]; then
            aab="$(ls app/build/outputs/bundle/prodRelease/*.aab | head -1)"
            apk="$(ls app/build/outputs/apk/prod/release/*.apk | head -1)"
            cp "$aab" "release-artefacts/redface2-${CHANNEL}-${V}.aab"
            cp "$apk" "release-artefacts/redface2-${CHANNEL}-${V}.apk"
            echo "play_aab=release-artefacts/redface2-${CHANNEL}-${V}.aab" >>"$GITHUB_OUTPUT"
          fi
          ls -la release-artefacts/

      - name: Upload workflow artefacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: redface2-${{ needs.resolve-target.outputs.channel }}-v${{ steps.meta.outputs.version_code }}-${{ steps.meta.outputs.short_sha }}
          path: release-artefacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (ledger tag + artifact source for F-Droid)
        # LEDGER-FIRST (Codex P2): the app-v<N> tag IS the versionCode ledger, so it must be persisted
        # BEFORE any Play side effect. If we tagged AFTER Play, a successful Play upload followed by a
        # runner cancellation / GitHub API failure would consume the code on Play without recording it →
        # the next dispatch recomputes the same code and Play rejects it. Creating the tag first makes
        # failure safe: either the tag exists (code consumed, move on) or it doesn't (code free, clean
        # retry), and Play runs only once the allocation is durably recorded. always() + staged guard so
        # the signed artefacts are always attached. No `on: release` trigger exists → the published event
        # cannot re-enter this workflow.
        if: ${{ always() && steps.artefacts.outcome == 'success' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          # The COMMIT ACTUALLY BUILT (the checked-out HEAD), not github.sha — a dispatch with `ref`
          # set to another branch/tag builds that ref, so tagging github.sha would break provenance.
          target_commitish: ${{ steps.meta.outputs.full_sha }}
          name: ${{ needs.resolve-target.outputs.app_label }} (build ${{ steps.meta.outputs.version_code }})
          body: |
            Build automatique — canal **${{ needs.resolve-target.outputs.channel }}**.
            Play track `${{ needs.resolve-target.outputs.play_track }}` + F-Droid `${{ needs.resolve-target.outputs.fdroid_package }}`.
            versionCode ${{ steps.meta.outputs.version_code }} · versionName ${{ steps.meta.outputs.version_name }} · ${{ steps.meta.outputs.short_sha }}.
            Non destiné au grand public.
          prerelease: true
          files: release-artefacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Play Console
        # beta → track `beta`, dev → track `internal`. Runs AFTER the ledger tag is recorded (above), so
        # a Play upload never consumes a code that isn't in the ledger. Skips cleanly when SA is absent.
        if: ${{ env.PLAY_UPLOAD == 'true' && steps.service_account.outputs.path != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJson: ${{ steps.service_account.outputs.path }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: ${{ steps.artefacts.outputs.play_aab }}
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
          whatsNewDirectory: app/src/main/play/whatsnew

      - name: Cleanup keystore + service account
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/upload.jks" "${RUNNER_TEMP}/play-service-account.json" || true

  # ──────────────────────────────────────────────────────────────────────
  # Notify redface2-fdroid (beta/dev). Plain ubuntu runner (native gh, #219).
  # always() + explicit result checks so a transient skip upstream never silently drops the notify.
  # ──────────────────────────────────────────────────────────────────────
  notify-fdroid:
    name: Notify F-Droid publisher
    needs: [resolve-target, build]
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.build.result == 'success' && needs.resolve-target.outputs.fdroid_channel != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate F-Droid publisher App token
        id: fdroid_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RF2_FDROID_APP_ID }}
          private-key: ${{ secrets.RF2_FDROID_APP_PRIVATE_KEY }}
          owner: ForumHFR
          repositories: redface2-fdroid
      - name: Trigger F-Droid publish
        env:
          GH_TOKEN: ${{ steps.fdroid_app_token.outputs.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          CHANNEL: ${{ needs.resolve-target.outputs.fdroid_channel }}
          PACKAGE_NAME: ${{ needs.resolve-target.outputs.fdroid_package }}
          APK_FILENAME: ${{ needs.build.outputs.fdroid_apk }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          echo "Triggering F-Droid publish (channel=${CHANNEL}, pkg=${PACKAGE_NAME}, tag=${TAG}, apk=${APK_FILENAME})"
          gh api repos/ForumHFR/redface2-fdroid/dispatches \
            -f event_type=rf2_release \
            -f "client_payload[channel]=${CHANNEL}" \
            -f "client_payload[package_name]=${PACKAGE_NAME}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[apk_filename]=${APK_FILENAME}" \
            -f "client_payload[version_code]=${VERSION_CODE}"
