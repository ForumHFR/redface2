name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fan-out by task type (was a single `verify` job running every task in one invocation). Each
  # entry runs on its own runner, so the four task groups parallelise PAST the 4-vCPU cap of a
  # single runner. `setup-gradle` gives each entry its own incremental build cache (seeded on push
  # to main/dev, read-only on PRs) so unchanged modules are not recompiled per job; the only
  # duplication is recompiling the PR's *changed* modules in each entry — the build cache cannot be
  # shared across jobs running concurrently.
  #
  # `:app` is flavored (#233 channels) so its variant tasks are flavored: the unqualified
  # `lintDebug` / `:app:assembleDebug` no longer resolve for `:app`. Use the default `prod` flavor
  # for the `:app` lint + APK; `lintDebug` / `test` / `testDebugUnitTest` still cover the
  # (flavour-less) core/feature/jvm modules, and the unqualified `test` covers `:app`'s unit tests
  # across variants (incl. the Konsist architecture test).
  verify:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: assemble
            gradle: ":app:assembleProdDebug"
          - name: test
            gradle: "test testDebugUnitTest"
          - name: lint
            gradle: "lintDebug :app:lintProdDebug"
          - name: detekt
            gradle: "detektAll"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: ${{ matrix.task.name }}
        run: ./gradlew ${{ matrix.task.gradle }}

  # Repo hygiene guards (no Gradle/SDK needed — pure bash). Fixture provenance is BLOCKING;
  # the large-file report is advisory (writes to the job summary, never fails). Wired into the
  # required aggregate check below so the guard is actually enforced on `main` (dev→main promotion).
  repo-guards:
    name: repo-guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fixture provenance (blocking)
        run: bash scripts/check-fixtures-provenance.sh
      - name: Changelog updated on versionName bump (PR, blocking)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          old=$(git show "FETCH_HEAD:app/build.gradle.kts" 2>/dev/null | grep -E '^[[:space:]]+versionName[[:space:]]*=' | head -1 | sed -E 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)
          new=$(grep -E '^[[:space:]]+versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "versionName base='${old:-?}' head='${new:-?}'"
          if [[ -n "$new" && "$new" != "$old" ]]; then
            echo "versionName bumpé (${old:-?} -> $new) -> entrée app/CHANGELOG.md requise"
            bash scripts/check-changelog-entry.sh "$new"
          else
            echo "versionName inchangé -> pas de check changelog requis"
          fi
      - name: Large production files report (advisory)
        run: bash scripts/report-large-files.sh

  # Single aggregate check whose name is the one `main`'s branch protection requires
  # ("Build, lint and test"). Green iff every `verify` matrix entry succeeded, so the fan-out stays
  # compatible with the existing required-status-check on `main` (dev→main promotion) without having
  # to re-point branch protection at four separate contexts.
  build-lint-and-test:
    name: Build, lint and test
    if: always()
    needs: [verify, repo-guards]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all required jobs to pass
        run: |
          verify='${{ needs.verify.result }}'
          guards='${{ needs.repo-guards.result }}'
          echo "verify matrix result: $verify | repo-guards result: $guards"
          if [ "$verify" != "success" ] || [ "$guards" != "success" ]; then
            echo "::error::A required job did not succeed (verify=$verify, repo-guards=$guards)."
            exit 1
          fi
