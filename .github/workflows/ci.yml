name: CI

on:
  push:
    branches:
      - main
      - dev
  # `edited` (en plus du trio par défaut) relance la CI quand le corps de la PR change : la garde
  # parité lit le corps EN DIRECT, donc RETIRER une ligne « Parity-Impact: none » après un run vert
  # doit re-déclencher la garde — sans `edited`, le check vert périmé resterait accroché (#1045).
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        # A version bump touches app/build.gradle.kts, so it deliberately remains a code PR.
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!drafts/**'
              - '!**/play/whatsnew/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE*'
              # Ré-inclusions (dorny: la DERNIÈRE règle qui matche gagne). Ces docs sont lues à
              # l'exécution par `DocsConsistencyTest` (:app) : les exclure du filtre `code`
              # désarmerait la garde de cohérence sur une PR qui ne touche qu'eux.
              - 'docs/specs/**'
              - 'docs/guides/contributing.md'
              - 'AGENTS.md'
              - 'CHANGELOG.md'
              - 'README.md'

  # Fan-out by task type (was a single `verify` job running every task in one invocation). Each
  # entry runs on its own runner, so the four task groups parallelise PAST the 4-vCPU cap of a
  # single runner. `setup-gradle` gives each entry its own incremental build cache (seeded on push
  # to main/dev, read-only on PRs) so unchanged modules are not recompiled per job; the only
  # duplication is recompiling the PR's *changed* modules in each entry — the build cache cannot be
  # shared across jobs running concurrently.
  #
  # `:app` is flavored (#233 channels) so its variant tasks are flavored: the unqualified
  # `lintDebug` / `:app:assembleDebug` no longer resolve for `:app`. Use the default `prod` flavor
  # for the `:app` lint + APK; `lintDebug` / `test` / `testDebugUnitTest` still cover the
  # (flavour-less) core/feature/jvm modules, and the unqualified `test` covers `:app`'s unit tests
  # across variants (incl. the Konsist architecture test).
  verify:
    name: ${{ matrix.task.name }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: assemble
            gradle: ":app:assembleProdDebug"
          - name: test
            gradle: "test testDebugUnitTest"
          - name: lint
            gradle: "lintDebug :app:lintProdDebug"
          - name: detekt
            gradle: "detektAll"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: ${{ matrix.task.name }}
        run: ./gradlew ${{ matrix.task.gradle }}

  # Repo hygiene guards (no Gradle/SDK needed — pure bash). Fixture provenance is BLOCKING;
  # the large-file report is advisory (writes to the job summary, never fails). Wired into the
  # required aggregate check below so the guard is actually enforced on `main` (dev→main promotion).
  # Job-level permissions REPLACE the workflow-level block: `pull-requests: read` lets the
  # reading-parity guard re-read the PR body LIVE (`gh pr view`) so editing the body + re-running
  # the job unblocks it — the `github.event` payload is frozen at trigger time (#1045).
  repo-guards:
    name: repo-guards
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fixture provenance (blocking)
        run: bash scripts/check-fixtures-provenance.sh
      - name: Changelog updated on versionName bump (PR, blocking)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          old=$(git show "FETCH_HEAD:app/build.gradle.kts" 2>/dev/null | grep -E '^[[:space:]]+versionName[[:space:]]*=' | head -1 | sed -E 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)
          new=$(grep -E '^[[:space:]]+versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "versionName base='${old:-?}' head='${new:-?}'"
          if [[ -n "$new" && "$new" != "$old" ]]; then
            echo "versionName bumpé (${old:-?} -> $new) -> entrée app/CHANGELOG.md requise"
            bash scripts/check-changelog-entry.sh "$new"
          else
            echo "versionName inchangé -> pas de check changelog requis"
          fi
      - name: Reading-parity matrix touched with the reading surface (PR, blocking)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch the base at its EVENT-TIME SHA, not the branch's current tip: a re-run keeps the
          # original merge-commit HEAD (GitHub re-runs reuse the initial GITHUB_SHA/GITHUB_REF), so
          # diffing against a base that moved on would blame unrelated base commits on this PR.
          # HEAD is the PR merge ref, so the two-dot diff against BASE_SHA is exactly the PR's
          # effective diff (no merge-base needed on a shallow clone).
          git fetch --depth=1 origin "$BASE_SHA"
          bash scripts/check-reading-parity-touch.sh "$BASE_SHA"
      - name: Large production files report (advisory)
        run: bash scripts/report-large-files.sh

  # Single aggregate check whose name is the one `main`'s branch protection requires
  # ("Build, lint and test"). Green iff `repo-guards` succeeded and `verify` either succeeded or was
  # skipped for a docs-only PR, so the fan-out stays compatible with the existing required-status
  # check on `main` (dev→main promotion) without re-pointing branch protection at separate contexts.
  build-lint-and-test:
    name: Build, lint and test
    if: always()
    needs: [changes, verify, repo-guards]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all required jobs to pass
        run: |
          code='${{ needs.changes.outputs.code }}'
          verify='${{ needs.verify.result }}'
          guards='${{ needs.repo-guards.result }}'
          echo "code changes: $code | verify matrix result: $verify | repo-guards result: $guards"
          if [ "$guards" != "success" ] || \
             { [ "$verify" != "success" ] && { [ "$code" != "false" ] || [ "$verify" != "skipped" ]; }; }; then
            echo "::error::A required job did not succeed (code=$code, verify=$verify, repo-guards=$guards)."
            exit 1
          fi
