# #1216 — compileSdk 37 : library modules inherit targetSdkVersion from compileSdk in their unit-test
# manifest, and Robolectric 4.16.1 caps at SDK 36 ("Package targetSdkVersion=37 > maxSdkVersion=36").
# Module-wide default for the Robolectric classes that carry no @Config(sdk = [...]) of their own;
# an explicit @Config on a class still wins. Same level as the repo-wide convention (sdk = [34]).
sdk=34
